<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickAiChat - Smart Study Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif; }
        body { background-color: #ffffff; color: #1f1f1f; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR STYLING */
        .sidebar { width: 260px; background-color: #f9f9f9; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid #e3e3e3; transition: 0.3s; z-index: 10; }
        .sidebar.collapsed { width: 0; padding: 0; overflow: hidden; border: none; }
        
        .brand-section { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px 8px; }
        
        /* BRAND LOGO CONTAINER FOR IMAGE */
        .brand-logo { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #e3e3e3; background: #fff; }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand-name { font-size: 18px; font-weight: 600; color: #000000; }

        .new-chat-container { margin-bottom: 20px; }
        .new-chat-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 16px; border: 1px solid #e3e3e3; background-color: #ffffff; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; color: #1f1f1f; }
        .new-chat-btn:hover { background-color: #f1f3f4; }
        .shortcut-hint { font-size: 11px; color: #747775; background: #f1f3f4; padding: 2px 6px; border-radius: 4px; border: 1px solid #e3e3e3; }

        .nav-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #444746; transition: 0.2s; }
        .nav-item:hover { background-color: #f1f3f4; color: #000; }

        /* HISTORY SECTIONS */
        .history-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
        .history-section-title { font-size: 12px; font-weight: 600; color: #747775; padding-left: 12px; display: flex; justify-content: space-between; align-items: center; }
        .clear-all-btn { background: transparent; border: none; color: #ba1a1a; font-size: 11px; cursor: pointer; padding-right: 12px; font-weight: 500; }
        .clear-all-btn:hover { text-decoration: underline; }
        
        .history-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #1f1f1f; gap: 8px; }
        .history-item:hover { background-color: #f1f3f4; }
        .history-item.active-chat { background-color: #e8f0fe; color: #0b57d0; font-weight: 500; }
        .history-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .delete-history-btn { background: transparent; border: none; color: #747775; cursor: pointer; font-size: 14px; display: none; padding: 2px; }
        .history-item:hover .delete-history-btn { display: inline-block; }
        .delete-history-btn:hover { color: #ba1a1a; }

        /* SIDEBAR SIGN IN CARD */
        .sidebar-signin-card { background-color: #ffffff; border: 1px solid #e3e3e3; padding: 16px; border-radius: 16px; font-size: 13px; color: #444746; line-height: 1.5; }
        .sidebar-signin-btn { width: 100%; background-color: #0b57d0; color: white; border: none; padding: 10px; border-radius: 20px; font-weight: 500; margin-top: 12px; cursor: pointer; font-size: 13px; }
        .sidebar-signin-btn:hover { background-color: #0842a0; }

        /* MAIN CHAT AREA */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #ffffff; }
        
        header { padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid transparent; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .toggle-btn { background: transparent; border: none; color: #444746; font-size: 20px; cursor: pointer; padding: 4px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .toggle-btn:hover { background-color: #f1f3f4; }
        .app-dropdown { font-size: 16px; font-weight: 500; color: #1f1f1f; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .header-right { display: flex; align-items: center; gap: 12px; }
        .icon-header-btn { background: transparent; border: none; font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #444746; }
        .icon-header-btn:hover { background-color: #f1f3f4; }
        .header-signin-btn { background-color: #0b57d0; color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 500; cursor: pointer; font-size: 14px; }
        .header-signin-btn:hover { background-color: #0842a0; }

        /* VIEW CONTAINER SYSTEM */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 20% 160px 20%; display: flex; flex-direction: column; gap: 32px; }
        
        /* INITIAL WELCOME SCREEN VIEW */
        .welcome-view { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-top: 20px; }
        
        /* WELCOME LOGO STYLING FOR LOGO IMAGE */
        .welcome-logo-img { width: 180px; height: auto; margin-bottom: 16px; object-fit: contain; }
        .welcome-title { font-size: 32px; font-weight: 500; color: #1f1f1f; margin-bottom: 12px; }
        
        /* RISHANT'S BANNER */
        .charity-banner { background-color: #f0f4f9; color: #0b57d0; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 500; margin-bottom: 40px; border: 1px solid #d3e3fd; max-width: 90%; }

        /* SUGGESTION GRID */
        .suggestions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 850px; margin-top: 24px; }
        .suggestion-card { background-color: #ffffff; border: 1px solid #e3e3e3; padding: 16px; border-radius: 16px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 100px; }
        .suggestion-card:hover { background-color: #f1f3f4; border-color: #ccc; }
        .suggestion-text { font-size: 13px; color: #444746; line-height: 1.5; font-weight: 500; }
        .suggestion-icon { align-self: flex-end; font-size: 14px; background: #f0f4f9; padding: 4px; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: #0b57d0; }

        /* CHAT MESSAGE BUBBLES */
        .message-wrapper { display: flex; gap: 18px; align-items: flex-start; max-width: 100%; }
        .user-wrapper { flex-direction: row-reverse; }
        .ai-wrapper { align-self: flex-start; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .user-wrapper .msg-avatar { background-color: #e3e3e3; color: #1f1f1f; font-weight: bold; font-size: 14px; }
        .ai-wrapper .msg-avatar { border: 1px solid #e3e3e3; background: #fff; }
        .ai-wrapper .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message { line-height: 1.6; font-size: 16px; color: #1f1f1f; word-wrap: break-word; white-space: pre-wrap; flex: 1; padding-top: 4px; }
        .user-wrapper .message { background-color: #f1f3f4; padding: 12px 20px; border-radius: 24px; max-width: 75%; }
        .image-preview-container { max-width: 180px; border-radius: 12px; overflow: hidden; margin-bottom: 8px; border: 1px solid #e3e3e3; display: none; margin-left: auto; }

        /* INPUT BOX WRAPPER */
        .input-outer-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 20% 24px 20%; background: linear-gradient(transparent, #ffffff 30%); }
        .input-box-wrapper { background-color: #f0f4f9; border-radius: 32px; display: flex; flex-direction: column; padding: 8px 16px; position: relative; transition: 0.2s; border: 1px solid transparent; }
        .input-box-wrapper:focus-within { background-color: #ffffff; border-color: #ccc; box-shadow: 0 1px 6px rgba(32,33,36,0.1); }
        
        .input-row { display: flex; align-items: center; width: 100%; }
        textarea { flex: 1; border: none; background: transparent; color: #1f1f1f; font-size: 16px; outline: none; padding: 10px 4px; resize: none; max-height: 120px; height: 44px; font-family: inherit; }
        
        .input-actions-left { display: flex; align-items: center; gap: 4px; }
        .input-actions-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        
        .action-round-btn { background: transparent; border: none; color: #444746; font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.1s; }
        .action-round-btn:hover { background-color: #e3e3e3; }
        .search-toggle-pill { display: flex; align-items: center; gap: 6px; background-color: #ffffff; border: 1px solid #e3e3e3; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #444746; cursor: pointer; }
        .search-toggle-pill:hover { background-color: #f1f3f4; }
        
        .send-btn { background-color: #e3e3e3; color: #747775; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: not-allowed; transition: 0.2s; }
        .send-btn.active { background-color: #0b57d0; color: white; cursor: pointer; }
        .send-btn.active:hover { background-color: #0842a0; }
        
        .mic-active { color: #ba1a1a !important; background-color: #ffdad6 !important; animation: pulse 1s infinite; }

        /* FOOTER DISCLAIMER */
        .footer-disclaimer { text-align: center; font-size: 12px; color: #747775; margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 4px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #e3e3e3; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #ccc; }
        
        @media (max-width: 1024px) {
            #chat-container, .input-outer-container { padding-left: 8%; padding-right: 8%; }
            .suggestions-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div>
            <div class="brand-section">
                <div class="brand-logo">
                    <img src="logo.jpg" alt="Logo">
                </div>
                <div class="brand-name">QuickAiChat</div>
            </div>
            
            <div class="new-chat-container">
                <button class="new-chat-btn" onclick="startNewChat()">
                    <span>📝 New Chat</span>
                    <span class="shortcut-hint">Ctrl K</span>
                </button>
            </div>

            <div class="nav-links">
                <div class="nav-item">🔍 Search</div>
                <div class="nav-item">📚 Library</div>
            </div>
            
            <div class="history-container">
                <div>
                    <div class="history-section-title">
                        <span>Recent Chats</span>
                        <button class="clear-all-btn" onclick="clearAllHistory()">Clear All</button>
                    </div>
                    <ul class="history-list" id="history-list-today"></ul>
                </div>
            </div>
        </div>

        <div class="sidebar-signin-card">
            <p>Sign in to sync your chats, access them anywhere, and more.</p>
            <button class="sidebar-signin-btn">Sign In</button>
        </div>
    </div>

    <div class="main-chat">
        <header>
            <div class="header-left">
                <button class="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
                <div class="app-dropdown">QuickAiChat ▾</div>
            </div>
            <div class="header-right">
                <button class="icon-header-btn">☀️</button>
                <button class="header-signin-btn">Sign In</button>
            </div>
        </header>

        <div id="chat-container">
            </div>

        <div class="input-outer-container">
            <div class="image-preview-container" id="img-preview-box">
                <img id="img-preview" src="" style="width: 100%; display: block;" alt="Preview">
            </div>
            
            <div class="input-box-wrapper">
                <div class="input-row">
                    <div class="input-actions-left">
                        <button class="action-round-btn" onclick="document.getElementById('file-input').click()">📎</button>
                        <input type="file" id="file-input" accept="image/*" hidden onchange="previewImage(event)">
                        <button class="search-toggle-pill">🌐 Search</button>
                    </div>
                    
                    <textarea id="user-input" placeholder="Ask anything..." oninput="toggleSendBtnState()" onkeypress="handleKeyPress(event)"></textarea>
                    
                    <div class="input-actions-right">
                        <button class="action-round-btn" id="mic-btn" onclick="startVoiceInput()">🎤</button>
                        <button class="send-btn" id="send-button" onclick="sendMessage()">➔</button>
                    </div>
                </div>
            </div>
            
            <div class="footer-disclaimer">
                <span>QuickAiChat can make mistakes. Check important info.</span>
                <span style="cursor:pointer; margin-left: 6px; background:#f0f4f9; width:16px; height:16px; display:inline-flex; items:center; justify-content:center; border-radius:50%; font-size:10px; font-weight:bold;">?</span>
            </div>
        </div>
    </div>

    <script>
        // API KEY CONFIG
        const API_KEY = "AQ.Ab8RN6Jh4Wb5Qojo-8ZoyUEhVelbGfq9RwcmMuW1gd5bJkv-EA"; 
        
        // THREAD-BASED STORAGE STATE
        let allChats = []; 
        let currentChatId = null; 
        let chatHistory = []; 
        
        let base64Image = null;
        let mimeType = null;
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const imgPreviewBox = document.getElementById('img-preview-box');
        const imgPreview = document.getElementById('img-preview');
        const sendButton = document.getElementById('send-button');

        window.onload = function() {
            // LOAD CHATS THREADS FROM LOCALSTORAGE
            const savedChats = localStorage.getItem('quick_ai_chats');
            if (savedChats) {
                allChats = JSON.parse(savedChats);
            }
            startNewChat();
            
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.value.trim() === "") this.style.height = '44px';
            });
        };

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function toggleSendBtnState() {
            if (userInput.value.trim().length > 0 || base64Image !== null) {
                sendButton.classList.add('active');
            } else {
                sendButton.classList.remove('active');
            }
        }

        // --- DYNAMIC WELCOME SCREEN RE-RUNNER ---
        function startNewChat() {
            currentChatId = null;
            chatHistory = [];
            base64Image = null;
            mimeType = null;
            userInput.value = '';
            userInput.style.height = '44px';
            imgPreviewBox.style.display = 'none';
            toggleSendBtnState();
            
            chatContainer.innerHTML = `
                <div class="welcome-view" id="welcome-view">
                    <img src="logo.jpg" class="welcome-logo-img" alt="Quick Learning Logo">
                    <h1 class="welcome-title">How can I help you today?</h1>
                    
                    <div class="charity-banner">
                        ✨ Welcome to Quick AI Made by Rishant for Poor Students who can't afford books and notes
                    </div>

                    <div class="suggestions-grid">
                        <div class="suggestion-card" onclick="runSuggestion('Explain quantum computing in simple terms')">
                            <p class="suggestion-text">Explain quantum computing in simple terms</p>
                            <div class="suggestion-icon">⚛️</div>
                        </div>
                        <div class="suggestion-card" onclick="runSuggestion('Write a short story about friendship')">
                            <p class="suggestion-text">Write a short story about friendship</p>
                            <div class="suggestion-icon">📝</div>
                        </div>
                        <div class="suggestion-card" onclick="runSuggestion('Give me tips to learn faster')">
                            <p class="suggestion-text">Give me tips to learn faster</p>
                            <div class="suggestion-icon">💡</div>
                        </div>
                        <div class="suggestion-card" onclick="runSuggestion('Help me with Python code')">
                            <p class="suggestion-text">Help me with Python code</p>
                            <div class="suggestion-icon">💻</div>
                        </div>
                    </div>
                </div>
            `;
            updateSidebarUI();
        }

        function runSuggestion(promptText) {
            userInput.value = promptText;
            userInput.style.height = (userInput.scrollHeight) + 'px';
            toggleSendBtnState();
            sendMessage();
        }

        function formatMath(element) {
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError : false
                });
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            mimeType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                imgPreview.src = e.target.result;
                imgPreviewBox.style.display = 'block';
                base64Image = e.target.result.split(',')[1]; 
                toggleSendBtnState();
            };
            reader.readAsDataURL(file);
        }

        function startVoiceInput() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) { alert("Browser voice support nahi karta."); return; }
            const recognition = new window.SpeechRecognition();
            const micBtn = document.getElementById('mic-btn');
            recognition.lang = 'hi-IN';
            recognition.onstart = () => micBtn.classList.add('mic-active');
            recognition.onend = () => micBtn.classList.remove('mic-active');
            recognition.onresult = (event) => { 
                userInput.value = event.results[0][0].transcript; 
                toggleSendBtnState();
            };
            recognition.start();
        }

        // --- SESSION WORKFLOW: THREAD ENGINE ---
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !base64Image) return;

            const welcomeView = document.getElementById('welcome-view');
            if(welcomeView) chatContainer.innerHTML = '';

            // 1. CHAT SESSION CREATOR (ONLY ONCE PER CONVERSATION)
            if (currentChatId === null) {
                currentChatId = Date.now();
                let headingText = text ? text : "Image Conversation";
                let chatTitle = headingText.substring(0, 26) + (headingText.length > 26 ? '...' : '');
                allChats.push({ id: currentChatId, title: chatTitle, messages: [] });
            }

            let userDisplay = text;
            let currentMime = mimeType;
            let currentB64 = base64Image;
            if (base64Image) {
                userDisplay = `<img src="${imgPreview.src}" style="max-width: 220px; border-radius: 12px; margin-bottom:8px; border:1px solid #e3e3e3;"><br>${text}`;
            }
            appendMessage(userDisplay, 'user', true);
            
            userInput.value = '';
            userInput.style.height = '44px';
            imgPreviewBox.style.display = 'none';
            toggleSendBtnState();

            // POLLINATIONS AI ROUTER
            if (text.toLowerCase().startsWith("generate image") || text.toLowerCase().startsWith("create image") || text.toLowerCase().startsWith("make image")) {
                const prompt = text.replace(/generate image of|create image of|make image of|generate image|create image/gi, "").trim();
                const loadingDiv = appendMessage("Creating your masterpiece...", 'ai').messageDiv;
                
                setTimeout(() => {
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
                    const resMarkup = `Here is your image for "${prompt}":<br><br><img src="${imgUrl}" style="max-width: 100%; border-radius: 16px; border: 1px solid #e3e3e3;">`;
                    loadingDiv.innerHTML = resMarkup;
                    
                    chatHistory.push({ role: "user", parts: [{ text: text }] });
                    chatHistory.push({ role: "model", parts: [{ text: `Image output for: ${prompt}` }] });
                    
                    syncCurrentChatToStorage();
                }, 1500);
                return;
            }

            let parts = [];
            if (text) parts.push({ text: text });
            if (currentB64) parts.push({ inlineData: { data: currentB64, mimeType: currentMime } });

            chatHistory.push({ role: "user", parts: parts });
            base64Image = null; mimeType = null;
            document.getElementById('file-input').value = '';

            // INITIAL SYNC
            syncCurrentChatToStorage();

            const messageDiv = appendMessage("Thinking...", 'ai').messageDiv;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': API_KEY },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    messageDiv.innerText = aiResponse;
                    formatMath(messageDiv);
                    chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                } 
                else if (data.error) {
                    messageDiv.innerHTML = `<span style="color: #ba1a1a; font-weight: 600;">Google API Error:</span> ${data.error.message}<br><small style="color:#747775;">Status Code: ${data.error.status}</small>`;
                    chatHistory.push({ role: "model", parts: [{ text: `Error: ${data.error.message}` }] });
                } 
                else {
                    messageDiv.innerText = "Error: Invalid response layout from Google Server.";
                    chatHistory.push({ role: "model", parts: [{ text: "Error: Invalid layout." }] });
                }
            } catch (error) {
                messageDiv.innerText = "Error: Connection completely failed.";
                chatHistory.push({ role: "model", parts: [{ text: "Error: Offline." }] });
            }
            
            // FINAL RESPONSE SYNC
            syncCurrentChatToStorage();
        }

        function syncCurrentChatToStorage() {
            let activeThread = allChats.find(c => c.id === currentChatId);
            if (activeThread) {
                activeThread.messages = JSON.parse(JSON.stringify(chatHistory));
                localStorage.setItem('quick_ai_chats', JSON.stringify(allChats));
            }
            updateSidebarUI();
        }

        // --- LOAD THREAD ON CLICK ---
        function loadChatThread(chatId) {
            const thread = allChats.find(c => c.id === chatId);
            if (!thread) return;

            currentChatId = chatId;
            chatHistory = JSON.parse(JSON.stringify(thread.messages));
            
            chatContainer.innerHTML = ''; // Canvas Reset
            
            chatHistory.forEach(msg => {
                let textContent = "";
                let isHTML = false;
                let hasImg = false;
                let imgSrc = "";
                
                msg.parts.forEach(part => {
                    if (part.text) textContent += part.text;
                    if (part.inlineData) {
                        hasImg = true;
                        imgSrc = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    }
                });
                
                if (hasImg) {
                    textContent = `<img src="${imgSrc}" style="max-width: 220px; border-radius: 12px; margin-bottom:8px; border:1px solid #e3e3e3;"><br>${textContent}`;
                    isHTML = true;
                }
                
                let resNode = appendMessage(textContent, msg.role === 'model' ? 'ai' : 'user', isHTML);
                if (msg.role === 'model') {
                    formatMath(resNode.messageDiv);
                }
            });
            updateSidebarUI();
        }

        function appendMessage(text, sender, isHTML = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}-wrapper`;
            
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerHTML = sender === 'user' ? 'QA' : '<img src="logo.jpg" alt="AI">';

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            if (isHTML) messageDiv.innerHTML = text;
            else messageDiv.innerText = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(messageDiv);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return { messageDiv };
        }

        // --- SIDEBAR UI GENERATOR ---
        function updateSidebarUI() {
            const historyListToday = document.getElementById('history-list-today');
            historyListToday.innerHTML = "";
            
            allChats.slice(-15).reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = "history-item";
                if (item.id === currentChatId) {
                    li.classList.add('active-chat');
                }
                
                const textSpan = document.createElement('span');
                textSpan.innerText = item.title;
                li.appendChild(textSpan);
                
                const delBtn = document.createElement('button');
                delBtn.className = "delete-history-btn";
                delBtn.innerHTML = "🗑️";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteHistoryItem(item.id);
                };
                li.appendChild(delBtn);
                
                li.onclick = () => { 
                    loadChatThread(item.id);
                };
                historyListToday.appendChild(li);
            });
        }

        function deleteHistoryItem(chatId) {
            allChats = allChats.filter(c => c.id !== chatId);
            localStorage.setItem('quick_ai_chats', JSON.stringify(allChats));
            if (currentChatId === chatId) {
                startNewChat();
            } else {
                updateSidebarUI();
            }
        }

        function clearAllHistory() {
            if(confirm("Kya aap saari chat threads delete karna chahte hain?")) {
                allChats = [];
                localStorage.removeItem('quick_ai_chats');
                startNewChat();
            }
        }
    </script>
</body>
</html>
